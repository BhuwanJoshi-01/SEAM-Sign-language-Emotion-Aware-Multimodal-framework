[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "seam"
version = "0.1.0"
description = "SEAM - Sign-language Emotion-Aware Multimodal framework: factorized non-manual modeling for emotion-aware ASL translation and expressive avatar generation"
requires-python = ">=3.11,<3.14"
# Exact pins. No ranges. A dependency that drifts between runs makes every
# number in the paper unreproducible, which is the one failure mode this
# project cannot recover from.
dependencies = [
    "mediapipe==0.10.14",
    "torch==2.13.0",
    "numpy==2.5.2",
    "opencv-contrib-python==5.0.0.93",
    "pandas==3.0.5",
    "pyarrow==25.0.1",
    "PyYAML==6.0.3",
    "fastapi==0.141.1",
    "uvicorn==0.52.3",
    "websockets==15.0.1",
    "onnx==1.22.0",
    "onnxruntime==1.29.0",
    "scikit-learn==1.9.0",
    "scipy==1.18.0",
    "matplotlib==3.11.1",
    "pillow==12.3.0",
    "protobuf==4.25.9",
    "absl-py==2.5.0",
]

[project.optional-dependencies]
# The CUDA execution provider is a separate distribution from onnxruntime and
# replacing the CPU build mid-project would move every latency number. Added in
# M2, deliberately not installed during M0 so the working env stays stable.
gpu = ["onnxruntime-gpu==1.29.0"]
# Translation + conditioned generation (M5/M6). Kept out of the core install so
# M0-M4 do not depend on a transformer download.
text = [
    "transformers==5.14.1",
    "tokenizers==0.23.0",
    "sacrebleu==2.6.0",
    "bert-score==0.3.13",
]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.3.0",
    "httpx==0.28.1",
    "ruff==0.16.3",
    "mypy==2.3.1",
    "pre-commit==4.6.2",
]

[project.scripts]
seam = "seam.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
asyncio_mode = "auto"
markers = [
    "slow: exercises real models or video; deselect with -m 'not slow'",
    "network: touches the network; deselect with -m 'not network'",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Explicit rather than inherited: a default set that shifts between ruff
# releases turns `make lint` into noise. E/F catch real errors, I keeps imports
# ordered, UP/B/SIM/C4 catch genuine smells.
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = [
    "ISC003",   # implicit string concat in collections is deliberate in report text
    "RUF001", "RUF002", "RUF003",  # typographic chars in report text are intentional
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.mypy]
python_version = "3.12"
packages = ["seam"]
mypy_path = "src"
ignore_missing_imports = true
warn_unused_configs = true
warn_redundant_casts = true
no_implicit_optional = true
disallow_untyped_defs = true
